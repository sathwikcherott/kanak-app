name: Android checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Backup codec and calendar rules (no Android SDK)
        run: bash scripts/check-core.sh
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0'
      - name: Unit tests, debug APK and instrumentation test compilation
        run: bash gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/schemas/
          if-no-files-found: ignore
  restore-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
          log-accepted-android-sdk-licenses: false
      - name: Install SDK and test image
        run: sdkmanager 'platforms;android-37.0' 'system-images;android-35;google_apis;x86_64'
      - name: Start Android 35 emulator
        run: |
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/kanak-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name kanak-ci --package 'system-images;android-35;google_apis;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/kanak-ci.avd" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds
          nohup "$ANDROID_HOME/emulator/emulator" -avd kanak-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/kanak-emulator.log 2>&1 &
          kanak_emulator_pid=$!
          adb start-server
          for attempt in $(seq 1 180); do
            if ! kill -0 "$kanak_emulator_pid" 2>/dev/null; then
              cat /tmp/kanak-emulator.log
              exit 1
            fi
            if timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          cat /tmp/kanak-emulator.log
          exit 1
      - name: Execute Room restore and UI instrumentation tests
        run: bash gradlew connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: restore-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            /tmp/kanak-emulator.log
          if-no-files-found: ignore
