name: Kanak phone preview
on:
  push:
    branches: [codex/auto-backup-phone-preview]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0'
      - name: Build and test preview
        run: bash gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Verify and package the APK
        run: |
          mkdir preview
          cp app/build/outputs/apk/debug/app-debug.apk preview/Kanak-Backup-Preview.apk
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$sdk_tools/apksigner" verify --verbose preview/Kanak-Backup-Preview.apk
          "$sdk_tools/aapt2" dump badging preview/Kanak-Backup-Preview.apk | head -12
          "$sdk_tools/aapt2" dump badging preview/Kanak-Backup-Preview.apk | grep -F "package: name='com.kanak.app.autobackuppreview'"
          sha256sum preview/Kanak-Backup-Preview.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Kanak-Backup-Preview
          path: preview/Kanak-Backup-Preview.apk
          if-no-files-found: error
